# Amanah Budget sync & notification server (Cloudflare Workers, free plan)
name = "amanah-sync"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Vault", "PushHub"]

# Check for due reminders every 15 minutes
[triggers]
crons = ["*/15 * * * *"]

# Optional: only accept requests from your app's address
# [vars]
# ALLOWED_ORIGIN = "https://aethlaecoclean.github.io"
